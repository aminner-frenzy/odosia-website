name: Deploy website

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ships straight into the odosia-vm's nginx (see frenzy-api's deploy/docker/nginx.conf,
      # which serves odosia.app/www.odosia.app from /opt/odosia/website).
      - name: Sync site files to odosia-vm
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.github' --exclude='README.txt'
          path: ./
          remote_path: /opt/odosia/website/
          remote_host: ${{ secrets.GCE_HOST }}
          remote_user: ${{ secrets.GCE_USER }}
          remote_key: ${{ secrets.GCE_SSH_KEY }}
